
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Exercício 2</title>
    <style>
        body {
            font-family:'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 50px;
        }

        .card {
            background: lightblue;
            padding: 40px;
            border-radius: 10px;
        }

        .card1 {
            transform: scale(1.1);
        }

        .card2 {
            transform: rotate(10deg);
        }

        .card3 {
            transform: translateY(-10px);
        }
    </style>
</head>
<body>

    <div class="card1">Card do Scale</div>
    <div class="card2">Card do Rotate</div>
    <div class="card3">Card do TranslateY</div>

</body>
</html>
