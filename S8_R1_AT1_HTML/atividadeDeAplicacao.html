<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade de Aplicação</title>
</head>
<body>
    <header>
        <h1> Formulário de Inscrição para Curso random 67</h1>
    </header>

    <main>
        <form action="" method="post">
            <h2>Formulário Legal</h2>

            <label for="nome">Nome: </label>
            <input type="text" name="nome" id="nome" placeholder="Fulano de Tal" required> <br>
            <label for="email">E-mail: </label>
            <input type="email" name="email" id="email" placeholder="fulanoDeTal@outlook.com" required> <br>
            <label for="tefelone">Telefone: </label>
            <input type="tel" name="tefelone" id="tefelone" placeholder="(13) 92034-2445" required> <br>
            <label for="dateNasc">Data de Nascimento: </label>
            <input type="date" name="dateNasc" id="dateNasc" placeholder="30/12/4324" required> <br>
            <label for="observ">Observações: </label>
            <textarea name="observ" id="observ" placeholder="Era uma vez, um gato Xadrez" required></textarea><br>
            <input type="submit" value="Enviar">

        </form>
    </main>
</body>
</html>
