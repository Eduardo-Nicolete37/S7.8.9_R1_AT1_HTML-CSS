<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Maneiro</title>
</head>
<body>
    <header>
        <h1>Formulario da Cabelereira Leila</h1>
    </header>
    <main>
        <form action="" method="post">
            <h2>Dados Pessoais: </h2>
            <label for="name">Nome:  </label>
            <input type="text" name="name" id="name" required placeholder="Joana D'Arc"> <br>
            <label for="email">E-mail: </label>
            <input type="email" name="email" id="email" placeholder="joanaDoGrau@proton.org" required> <br>
            <label for="cefelone">Telefone: </label>
            <input type="tel" name="cefelone" id="cefelone" placeholder="(23) 19136-7022" required> <br>
            <label for="city">Cidade: </label>
            <input type="text" name="city" id="city" placeholder="Xique-Xique - Bahia" required> <br> <br>
            
            <h2>Dados Complementares: </h2>
            <label for="dateNasc">Data de Nascimento: </label>
            <input type="date" name="dateNasc" id="dateNasc" placeholder="13/06/22" required> <br>
            <label for="observ">Observações: </label>
            <textarea name="observ" id="observ" placeholder="Eu sou maneiro" required></textarea>
        </form>
    </main>
    
</body>
</html>
