<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        main {
            text-align: center;
            border: 300 px;
            padding: 300 px;
        }
        .buttonOne{
            background: scroll;
            transition: 0.5s;
        }
        .buttonTwo{
            color: aliceblue;
            transition: 0.5s;
        }
        .buttonThree{
            transform: scale(1.1);
            transition: 0.5s;
        }
    </style>
    <title>Atividade dos botões</title>
</head>
<body>
    <main>
        <button type="button" class="buttonOne">Botão do Background</button> <br>
        <button type="button" class="buttonTwo">Botão do Color</button> <br>
        <button type="button" class="buttonThree">Botão do Scale</button> <br>
    </main>
</body>
</html>
