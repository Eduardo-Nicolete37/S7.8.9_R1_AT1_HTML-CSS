<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - EmpresaY</title>
</head>
<body>
    <header style="text-align: center;">
        <h1>Cadastro na EmpresaY</h1>
    </header>

    <main>
        <section style="text-align: center;">
            <form action="" method="post">

                <h2>Dados Pessoais</h2>
                <hr>
                <label for="name">Nome Completo: </label>
                <input type="text" name="name" id="name" placeholder="Fulano de Tal" required> <br>
                <label for="email">E-mail: </label>
                <input type="email" name="email" id="email" placeholder="userMail@gmail.com" required> <br>
                <label for="telefone">Telefone: </label>
                <input type="tel" name="telefone" id="telefone" placeholder="(19)34092-3453" required> <br>
                <label for="dateNasc">Data de Nascimento: </label>
                <input type="date" name="dateNasc" id="dateNasc">
                <hr> <br>
                <h2>Dados Profissionais</h2>
                <label for="atuaArea">Área de atuação</label>
                <input type="text" name="atuaArea" id="atuaArea" placeholder="TI (Técnico da Informação)" required> <br>
                <label for="pretenSal">Pretensão salarial: </label>
                <input type="number" name="pretenSal" id="pretenSal" step="0.01" placeholder="3454.00" required> R$ <br>
                <label for="PortURL">Portfólio (URL): </label>
                <input type="url" name="PortURL" id="PortURL" placeholder="www.github.com/SEU-REPOSITORIO" required> <br>
                <input type="submit" value="Enviar">
            </form>
        </section>
    </main>
</body>
</html>
